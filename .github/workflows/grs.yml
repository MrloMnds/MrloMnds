name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Roda uma vez por dia à meia-noite
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=MrloMnds&show_icons=true&hide_border=true&hide=issues,stars&show=reviews,prs_merged,prs_merged_percentage,prs_commented&bg_color=161616&icon_color=e11d48&title_color=e11d48&text_color=888888&border_color=555555&include_all_commits=true&rank_icon=github&custom_title=How much I've worked so far :D
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=MrloMnds&theme=radical&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
